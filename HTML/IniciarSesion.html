<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="../CSS/IniciarSesion.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <div class="circles">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </div>
    
    <div class="login-container">
        <div class="login-image">
            <div class="brand-overlay">
                <img src="../IMG/ImagenCorreas.png" alt="Correas de cuero" class="product-image">
            </div>
        </div>
        <div class="login-form">
            <div class="login-header">
                <div class="logo-container">
                    <img src="../IMG/LogoEmpresa.png" alt="Logo Empresa" class="logo">
                </div>
                <h1>Bienvenido</h1>
                <p>Ingresa tus credenciales para acceder</p>
            </div>
            
            <form method="post" action="Servlet">
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                    </div>
                    <input type="text" placeholder="Nombre de usuario o correo" required>
                </div>
                
                <div class="input-group">
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                    </div>
                    <input type="password" id="passwordField" name="password" placeholder="Contraseña" required>
                    <div class="password-toggle" id="togglePassword">
                        <i class="far fa-eye" id="eyeIcon"></i>
                    </div>
                </div>
                
                <a href="../HTML/Sidebar.html">
                    <button  type="submit" class="login-button" >
                        Iniciar Sesión
                        <div class="button-icon">
                            <i class="fas fa-arrow-right"></i>
                        </div>
                    </button>
                </a>
            </form>
            
            <div class="login-footer">
                <p>&copy; 2025 Tu Empresa. Todos los derechos reservados.</p>
            </div>
        </div>
    </div>

    <script src="../JAVASCRIP/FuncionOcultarContraseña.js"></script>
</body>
</html>
