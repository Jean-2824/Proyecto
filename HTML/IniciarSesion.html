<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
    <link rel="stylesheet" href="../CSS/IniciarSesion.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="image-container">
                <img src="../IMG/ImagenCorreas.png" alt="Correas de cuero">
            </div>
            <div class="form-container">
                <div class="login-form">
                    <h1>Inicio de sesión</h1>
                    
                    <div class="input-group">
                        <div class="icon-container">
                            <i class="fas fa-user"></i>
                        </div>
                        <input type="text" placeholder="Correo o Nombre de usuario">
                    </div>
                    
                    <div class="input-group">
                        <div class="icon-container">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input type="password" id="passwordField" placeholder="Contraseña">
                        <div class="eye-icon" id="togglePassword">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </div>
                    </div>
                    
                    <a href="../HTML/Sidebar.html">
                        <button class="login-button">Iniciar Sesión</button>
                    </a>
                      
                </div>
            </div>
        </div>
    </div>

    <script src="../JAVASCRIP/FuncionOcultarContraseña.js"></script>
</body>
</html>
